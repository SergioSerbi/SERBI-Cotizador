<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cotizador | SERBI Pinturas y Recubrimientos</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <img src="/static/img/logo.png" class="logo" alt="SERBI">
            <div>
                <h1>SERBI COTIZADOR</h1>
                <p>SERBI Pinturas y Recubrimientos</p>
                {% if fecha_actualizacion %}
                <p class="fechaActualizacion">Última actualización: <strong>{{ fecha_actualizacion }}</strong></p>
                {% endif %}
            </div>
        </header>

        <section class="buscador" aria-label="Buscar productos">
            <input type="search" id="buscar" autocomplete="off" placeholder="Buscar por código o descripción…">
        </section>
        <section id="resultados" class="resultados" aria-live="polite"></section>

        <section class="carrito" aria-label="Cotización actual">
            <div class="tituloCarrito">
                <h2>🛒 Cotización</h2>
                <button id="btnVaciar" type="button">Vaciar</button>
            </div>
            <div id="cotizacion"></div>
            <div class="total"><h2 id="total">TOTAL: $0.00</h2></div>
            <div class="acciones">
                <button id="btnWhatsapp" type="button">Enviar por WhatsApp</button>
                <button id="btnCopiar" type="button">Copiar cotización</button>
            </div>
        </section>
    </main>

    <div id="modalProducto" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
        <div class="modalContenido">
            <button id="cerrarModal" class="cerrarModal" type="button" aria-label="Cerrar">×</button>
            <h2 id="modalTitulo"></h2>
            <div id="seccionPrecio" class="seccionModal">
                <label class="etiquetaModal">Selecciona el precio</label>
                <div id="opcionesPrecio" class="opcionesPrecio"></div>
            </div>
            <div class="seccionModal">
                <label class="etiquetaModal" for="cantidadModal">Cantidad</label>
                <div class="cantidadBox">
                    <button id="menos" type="button" aria-label="Restar cantidad">−</button>
                    <input id="cantidadModal" type="number" min="1" value="1" inputmode="numeric">
                    <button id="mas" type="button" aria-label="Sumar cantidad">+</button>
                </div>
            </div>
            <div class="botonesModal">
                <button id="cancelarModal" type="button">Cancelar</button>
                <button id="agregarModal" type="button">Agregar a cotización</button>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
